name: Metrics

on:
  schedule:
    # Daily at 02:17 UTC (10:17 CST)
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: noahziheng
          base: header, activity, community, metadata
          config_timezone: Asia/Shanghai
          extras_css: |
            svg {
              background-color: #161b22;
            }
            h1, h2, h3 {
              color: #58a6ff !important;
            }
            .field {
              color: #c9d1d9;
            }
            .field svg {
              fill: #c9d1d9;
            }

      - uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-repos.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: noahziheng
          base: ""
          config_timezone: Asia/Shanghai
          plugin_repositories: yes
          plugin_repositories_featured: artusjs/core, noahziheng/ssr-helper
          extras_css: |
            svg {
              background-color: #161b22;
            }
            h1, h2, h3 {
              color: #58a6ff !important;
            }
            .field {
              color: #c9d1d9;
            }
            .field svg {
              fill: #c9d1d9;
            }
