name: Metrics

on:
  schedule:
    # Daily at 02:17 UTC (10:17 CST)
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: noahziheng
          # Profile sidebar already shows name/avatar/followers; keep only
          # contribution/PR/issue stats that the sidebar does not show.
          base: activity, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, bytes-size
          commits_authoring: noahziheng, noahgaocn@users.noreply.github.com, Noah Gao, noahgaocn@outlook.com, ziheng.gzh, ziheng.gzh@alibaba-inc.com, Jarvis, jarvis@noahgao.net
          extras_js: |
            // Drop rows showing a 0 value (e.g. "0 Pull requests reviewed")
            document.querySelectorAll("div.field").forEach(el => {
              if (/^\s*0\b/.test(el.textContent.trim())) el.remove();
            });

      - uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-repos.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: noahziheng
          base: ""
          config_timezone: Asia/Shanghai
          plugin_repositories: yes
          plugin_repositories_featured: artusjs/core, noahziheng/ssr-helper
